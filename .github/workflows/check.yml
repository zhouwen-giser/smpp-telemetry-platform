name: Telemetry checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:typecheck
      # Joint deployment behavior also needs the adjacent SMPP source repository.
      # Its explicit local gate is npm run test:deployment in the paired workspace.
      - run: npm run typecheck && npm run check:deployment:types && npm test
      - run: node --test deploy/joint-development/qualification/*.test.mjs
      - run: npm run test:arm64-build
      - run: npm run test:arm64-contract
      - run: npm run test:clickhouse
