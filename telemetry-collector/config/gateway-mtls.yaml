receivers:
  otlp/smpp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /run/secrets/collector_server_cert
          key_file: /run/secrets/collector_server_key
          client_ca_file: /run/secrets/runtime_client_ca
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /run/secrets/collector_server_cert
          key_file: /run/secrets/collector_server_key
          client_ca_file: /run/secrets/runtime_client_ca
  prometheus/smpp_runtime:
    config:
      scrape_configs:
        - job_name: sdar-ugv-runtime
          scheme: http
          metrics_path: ${env:SMPP_METRICS_PATH}
          scrape_interval: ${env:SMPP_METRICS_SCRAPE_INTERVAL}
          static_configs:
            - targets: ["${env:SMPP_METRICS_TARGET}"]

processors:
  memory_limiter/provider_ops:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  filter/provider_ops_only:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["sdar.record.id"] == nil'
        - 'attributes["sdar.record.hash"] == nil'
        - 'attributes["sdar.schema.name"] != "sdar.provider.ops.event"'
        - 'attributes["sdar.schema.version"] != "1.1.0"'
        - 'body == nil or body["schemaName"] != "sdar.provider.ops.event"'
  resource/trusted_ingress:
    attributes:
      - key: telemetry.source.system
        value: smpp
        action: upsert
      - key: telemetry.source.collector_id
        value: ${env:COLLECTOR_ID}
        action: upsert
      - key: telemetry.source.trust_domain
        value: ${env:TRUST_DOMAIN}
        action: upsert
      - key: telemetry.source.deployment_id
        value: ${env:SMPP_DEPLOYMENT_ID}
        action: upsert
      - key: telemetry.ingress.mode
        value: gateway-mtls
        action: upsert
  transform/provider_ops_contract:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["telemetry.channel"], "smpp.provider_ops")
          - set(attributes["telemetry.contract.name"], attributes["sdar.schema.name"])
          - set(attributes["telemetry.contract.version"], attributes["sdar.schema.version"])
  resource/smpp_runtime_metrics:
    attributes:
      - key: telemetry.source.system
        value: smpp
        action: upsert
      - key: telemetry.channel
        value: smpp.runtime_metrics
        action: upsert
      - key: telemetry.source.deployment_id
        value: ${env:SMPP_DEPLOYMENT_ID}
        action: upsert
      - key: telemetry.source.runtime_instance_id
        value: ${env:SMPP_RUNTIME_INSTANCE_ID}
        action: upsert
      - key: telemetry.source.provider_id
        value: ${env:SMPP_PROVIDER_ID}
        action: upsert

exporters:
  otlphttp/processor_provider_ops:
    endpoint: https://telemetry-processor:8443/internal/otlp
    compression: none
    timeout: 10s
    tls:
      ca_file: /run/secrets/processor_server_ca
      cert_file: /run/secrets/collector_client_cert
      key_file: /run/secrets/collector_client_key
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  debug/best_effort:
    verbosity: basic
  prometheus/smpp_runtime:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    logs/provider_ops:
      receivers: [otlp/smpp]
      processors: [memory_limiter/provider_ops, filter/provider_ops_only, resource/trusted_ingress, transform/provider_ops_contract]
      exporters: [otlphttp/processor_provider_ops]
    traces/best_effort:
      receivers: [otlp/smpp]
      processors: [memory_limiter/provider_ops]
      exporters: [debug/best_effort]
    metrics/smpp_runtime:
      receivers: [otlp/smpp, prometheus/smpp_runtime]
      processors: [memory_limiter/provider_ops, resource/smpp_runtime_metrics]
      exporters: [prometheus/smpp_runtime, debug/best_effort]
