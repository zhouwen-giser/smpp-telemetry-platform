apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: default
      defaultDatabase: telemetry_serving
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
  - name: SMPP Runtime Metrics
    uid: smpp-runtime-prometheus
    type: prometheus
    access: proxy
    url: http://otel-collector:9464
    isDefault: false
