apiVersion: 1
deleteDatasources:
  - name: SMPP Runtime Metrics
    orgId: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: default
      defaultDatabase: telemetry_serving
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
