# Standalone joint-development profile: deliberately no Grafana service or port.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.14.14
    platform: linux/amd64
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [clickhouse_password]
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test:
        [
          CMD-SHELL,
          'clickhouse-client --password "$$(cat /run/secrets/clickhouse_password)" --query "SELECT 1"',
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  telemetry-migrate:
    image: smpp-telemetry-processor:ugv-debug
    build: { context: ., dockerfile: telemetry-processor/Dockerfile }
    restart: "no"
    depends_on:
      clickhouse: { condition: service_healthy }
    command: [node, dist/telemetry-schema/tools/migrate.js]
    environment:
      MIGRATION_LOCK_FILE: /var/lib/smpp-telemetry/migrations/migration.sqlite
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [clickhouse_password]
    volumes: ["migration-state:/var/lib/smpp-telemetry/migrations"]

  telemetry-processor:
    entrypoint: ["/bin/sh", "/run/telemetry/wal-reader-entrypoint.sh"]
    command: ["node", "dist/telemetry-processor/src/apps/index.js"]
    image: smpp-telemetry-processor:ugv-debug
    build: { context: ., dockerfile: telemetry-processor/Dockerfile }
    restart: unless-stopped
    depends_on:
      telemetry-migrate: { condition: service_completed_successfully }
    environment:
      PROCESSOR_HOST: 0.0.0.0
      PROCESSOR_PORT: "8443"
      PROCESSOR_ADMIN_API_KEY: ${PROCESSOR_ADMIN_API_KEY:-}
      PROCESSOR_REQUIRE_COLLECTOR_ID: "true"
      PROCESSOR_ALLOWED_COLLECTOR_IDS: ugv-debug-collector
      WAL_MIN_READER_VERSION: "2"
      WAL_DIR: /var/lib/smpp-telemetry/wal
      WAL_MIN_FREE_BYTES: ${WAL_MIN_FREE_BYTES:-67108864}
      WAL_CACHE_MAX_BYTES: ${WAL_CACHE_MAX_BYTES:-8388608}
      WAL_ARCHIVE_DIR: ${WAL_ARCHIVE_DIR:-/var/lib/smpp-telemetry/wal/archive}
      WAL_GC_ENABLED: ${WAL_GC_ENABLED:-false}
      WAL_MAINTENANCE_INTERVAL_MS: ${WAL_MAINTENANCE_INTERVAL_MS:-60000}
      REPLAY_TARGETS_FILE: ${REPLAY_TARGETS_FILE:-}
      SOURCE_MAPPINGS_FILE: /app/config/source-mappings.json
      PROJECTION_TARGETS_FILE: /app/config/projection-targets.json
      EXPORT_INTERVAL_MS: "500"
    secrets: [clickhouse_password, sdar_warehouse_password]
    volumes:
      - ./deploy/wal-reader-guard.mjs:/run/telemetry/wal-reader-guard.mjs:ro
      - ./deploy/wal-reader-entrypoint.sh:/run/telemetry/wal-reader-entrypoint.sh:ro
      - processor-wal:/var/lib/smpp-telemetry/wal
      - ${UGV_DEBUG_STATE_ROOT:?}/source-mappings.json:/app/config/source-mappings.json:ro
      - ${UGV_DEBUG_STATE_ROOT:?}/projection-targets.json:/app/config/projection-targets.json:ro
    ports: ["0.0.0.0:8443:8443"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8443/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    # file_storage and its named volume are private to this debug Collector.
    user: "0:0"
    restart: unless-stopped
    depends_on:
      telemetry-processor: { condition: service_healthy }
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ${UGV_DEBUG_STATE_ROOT:?}/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - collector-queue:/var/lib/otelcol/storage
    ports:
      - "0.0.0.0:4317:4317"
      - "0.0.0.0:4318:4318"
      - "0.0.0.0:13133:13133"
      - "0.0.0.0:8888:8888"
      - "0.0.0.0:9464:9464"
    networks: [default, observability]
    healthcheck:
      test:
        [
          CMD,
          /otelcol-contrib,
          validate,
          --config=/etc/otelcol-contrib/config.yaml,
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  query-api:
    image: smpp-telemetry-query:ugv-debug
    build: { context: ., dockerfile: telemetry-dashboard/query-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      telemetry-migrate: { condition: service_completed_successfully }
    environment:
      QUERY_API_HOST: 0.0.0.0
      QUERY_API_PORT: "8088"
      QUERY_SNAPSHOTS_ENABLED: ${QUERY_SNAPSHOTS_ENABLED:-false}
      QUERY_READER_REGISTRY_FILE: ${QUERY_READER_REGISTRY_FILE:-}
      QUERY_SNAPSHOT_TARGET_ID: ${QUERY_SNAPSHOT_TARGET_ID:-standalone-smpp}
      QUERY_API_KEY: ""
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [clickhouse_password]
    ports: ["0.0.0.0:8088:8088"]
    networks:
      default:
      observability:
        aliases: [smpp-telemetry-query]

secrets:
  sdar_warehouse_password:
    file: ${UGV_DEBUG_STATE_ROOT:?}/sdar-telemetry/warehouse-password
  clickhouse_password:
    file: ${UGV_DEBUG_STATE_ROOT:?}/clickhouse-password
volumes:
  migration-state:
  clickhouse-data:
  processor-wal:
  collector-queue:
networks:
  observability:
    external: true
    name: sdar-ugv-debug-observability
